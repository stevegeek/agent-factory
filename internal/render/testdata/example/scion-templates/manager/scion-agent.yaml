schema_version: "1"
description: "The factory's manager and operator: answers questions about the factory, drafts and proposes; the tick applies under the rights tiers"
agent_instructions: agents.md
default_harness_config: claude
max_duration: "45m"
resources:
  limits:
    memory: 700Mi
    cpu: "2"
  requests:
    memory: 300Mi
# what the manager may read, and only read: it drafts and proposes; the tick applies under the rights tiers
volumes:
  - type: local
    source: /home/factory/factory/board
    target: /factory/board
    read_only: true
  - type: local
    source: /home/factory/factory/logs
    target: /factory/logs
    read_only: true
  - type: local
    source: /home/factory/factory/config.toml
    target: /factory/config.toml
    read_only: true
  - type: local
    source: /home/factory/.scion/templates
    target: /factory/templates
    read_only: true
  - type: local
    source: /home/factory/factory/sysinfo.json
    target: /factory/sysinfo.json
    read_only: true
  - type: local
    source: /home/factory/factory/context
    target: /factory/context
    read_only: true
  - type: local
    source: /home/factory/factory/deploys
    target: /factory/deploys
    read_only: true
