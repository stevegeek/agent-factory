schema_version: "1"
description: "Designs a change to a library from the maintainer's idea and proposes worker tickets; never commits"
agent_instructions: agents.md
default_harness_config: claude
max_duration: "45m"
resources:
  limits:
    memory: 900Mi
    cpu: "2"
  requests:
    memory: 300Mi
env:
  BUNDLE_PATH: /home/scion/.bundle-cache
volumes:
  - type: local
    source: /home/factory/factory/cache/bundle
    target: /home/scion/.bundle-cache
    read_only: true      # one project's agent must not change the gems another project's gate trusts
