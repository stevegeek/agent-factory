{{define "layout" -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{.Title}} · Foreman</title>
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"historyCacheSize":0,"refreshOnHistoryMiss":true}'>
<link rel="stylesheet" href="{{asset "foreman.css"}}">
<link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
<script src="{{asset "htmx.min.js"}}" defer></script>
<script src="{{asset "foreman.js"}}" defer></script>
</head>
<body hx-boost="true">
<div class="wrap">
  <div class="app">
    {{- if .Tab}}
    <header class="bar">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">Foreman</span></a>
      <nav class="tabs" aria-label="Views">
        <a class="tab" id="tab-desk" data-live href="/" {{if eq .Tab "desk"}}aria-current="page"{{end}}>Desk {{if .DeskCount}}<span class="n hot">{{.DeskCount}}</span>{{end}}</a>
        <a class="tab" href="/floor" {{if eq .Tab "floor"}}aria-current="page"{{end}}>Floor</a>
        <a class="tab" href="/boards" {{if eq .Tab "boards"}}aria-current="page"{{end}}>Boards</a>
      </nav>
      <form class="who" method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <button type="submit" class="linkbtn">Log out</button>
      </form>
    </header>
    {{- end}}
    {{template "content" .}}
  </div>
</div>
{{with .Version}}<div id="live" hidden data-v="{{.}}"></div>{{end}}
{{with .Flash}}<div class="toast {{.Kind}}" role="status">{{.Text}}</div>{{end}}
</body>
</html>
{{- end}}
