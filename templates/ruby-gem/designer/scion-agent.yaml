schema_version: "1"
description: "Designs a change to a Ruby gem from the maintainer's idea and proposes worker tickets; never commits"
agent_instructions: agents.md
default_harness_config: claude
max_duration: "45m"
resources:
  limits:
    memory: 900Mi
    cpu: "2"
  requests:
    memory: 300Mi
env:
  BUNDLE_PATH: /home/scion/.bundle-cache
volumes:
  - type: local
    source: {{factory_root}}/cache/bundle
    target: /home/scion/.bundle-cache
