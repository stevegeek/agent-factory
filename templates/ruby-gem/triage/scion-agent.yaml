schema_version: "1"
description: "Triages one incoming report: real, in scope, reproducible; never commits"
agent_instructions: agents.md
default_harness_config: claude
max_duration: "20m"
resources:
  limits:
    memory: 900Mi
    cpu: "2"
  requests:
    memory: 300Mi
env:
  BUNDLE_PATH: /home/scion/.bundle-cache
volumes:
  - type: local
    source: {{factory_root}}/cache/bundle
    target: /home/scion/.bundle-cache
